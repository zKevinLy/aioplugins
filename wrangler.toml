
name = "aioplugins"
main = "src/index.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "db_aioplugins"
# Update database_id with your local database ID after running: npx wrangler d1 create db_aioplugins
# database_id = "<your-local-db-id>"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
