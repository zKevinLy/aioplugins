
name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          VERSION="$RELEASE_TAG"

          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --json tagName --jq '.tagName')
          fi

          if [ -z "$VERSION" ]; then
            echo "No published GitHub release found."
            exit 1
          fi

          export VERSION

          node --input-type=module -e '
            import { writeFileSync } from "node:fs";

            writeFileSync(
              "public/version.json",
              JSON.stringify({ version: process.env.VERSION }) + "\n"
            );
          '

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply db_aioplugins --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
