name: Release Please

# Opens (and keeps updated) a "release" pull request based on your commit
# messages. Merging that PR creates the git tag, the GitHub Release, the
# CHANGELOG.md entry, and the package.json version bump.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
